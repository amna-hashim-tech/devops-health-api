<!DOCTYPE html>
<html>
<head>
    <title>Service Status Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
            padding: 2rem;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }
        h1 { font-size: 1.5rem; color: #38bdf8; }
        .overall {
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.875rem;
        }
        .overall-ok { background: #052e16; color: #4ade80; border: 1px solid #166534; }
        .overall-bad { background: #450a0a; color: #f87171; border: 1px solid #991b1b; }
        .overall-warn { background: #422006; color: #fbbf24; border: 1px solid #92400e; }
        .info-bar {
            display: flex; gap: 1.5rem;
            margin-bottom: 1.5rem;
            font-size: 0.75rem; color: #64748b;
        }
        table { width: 100%; border-collapse: collapse; margin-bottom: 2rem; }
        th {
            text-align: left; padding: 0.75rem 1rem;
            font-size: 0.75rem; text-transform: uppercase;
            letter-spacing: 0.05em; color: #64748b;
            border-bottom: 1px solid #1e293b;
        }
        td { padding: 1rem; border-bottom: 1px solid #1e293b; font-size: 0.875rem; }
        tr:hover { background: #1e293b; }
        .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 0.5rem; }
        .dot-healthy { background: #4ade80; animation: pulse-green 2s infinite; }
        .dot-degraded { background: #fbbf24; animation: pulse-yellow 2s infinite; }
        .dot-down { background: #f87171; }
        @keyframes pulse-green {
            0%, 100% { box-shadow: 0 0 0 0 rgba(74,222,128,0.4); }
            50% { box-shadow: 0 0 0 4px rgba(74,222,128,0); }
        }
        @keyframes pulse-yellow {
            0%, 100% { box-shadow: 0 0 0 0 rgba(251,191,36,0.4); }
            50% { box-shadow: 0 0 0 4px rgba(251,191,36,0); }
        }
        .badge { padding: 0.2rem 0.6rem; border-radius: 4px; font-size: 0.75rem; font-weight: 500; }
        .badge-healthy { background: #052e16; color: #4ade80; }
        .badge-degraded { background: #422006; color: #fbbf24; }
        .badge-down { background: #450a0a; color: #f87171; }
        .ms { color: #94a3b8; }
        .bar-wrap { width: 100px; height: 6px; background: #1e293b; border-radius: 3px; display: inline-block; margin-left: 0.5rem; vertical-align: middle; }
        .bar-fill { height: 100%; border-radius: 3px; }
        .section-title { font-size: 0.875rem; color: #64748b; margin-bottom: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; }
        .log-table { width: 100%; border-collapse: collapse; }
        .log-table td { padding: 0.6rem 1rem; border-bottom: 1px solid #1e293b; font-size: 0.8rem; color: #94a3b8; }
        .log-empty { color: #475569; font-size: 0.8rem; padding: 1rem 0; }
        .updated { text-align: center; margin-top: 2rem; font-size: 0.7rem; color: #475569; }
        .checking { color: #475569; font-style: italic; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Service Status Dashboard</h1>
        <div class="overall overall-ok" id="overall">Checking...</div>
    </div>
    <div class="info-bar" id="info-bar"></div>

    <table>
        <thead>
            <tr>
                <th>Service</th>
                <th>Status</th>
                <th>Response Time</th>
                <th>Threshold</th>
            </tr>
        </thead>
        <tbody id="tbody"><tr><td colspan="4" class="checking">Checking services...</td></tr></tbody>
    </table>

    <div class="section-title">Incident Log</div>
    <table class="log-table">
        <tbody id="log-body"><tr><td class="log-empty">No incidents recorded.</td></tr></tbody>
    </table>

    <p class="updated" id="updated"></p>

    <script>
        async function load() {
            const hRes = await fetch('/health');
            const health = await hRes.json();

            document.getElementById('info-bar').innerHTML =
                '<span>Version: ' + health.version + '</span>' +
                '<span>Env: ' + health.environment + '</span>' +
                '<span>Host: ' + health.hostname + '</span>' +
                '<span>Uptime: ' + Math.floor(health.uptime_seconds/60) + 'm</span>';

            const sRes = await fetch('/api/services');
            const data = await sRes.json();

            const hasDown = data.services.some(s => s.status === 'down');
            const hasDeg = data.services.some(s => s.status === 'degraded');
            const overall = document.getElementById('overall');
            if (hasDown) {
                overall.textContent = 'Major Outage';
                overall.className = 'overall overall-bad';
            } else if (hasDeg) {
                overall.textContent = 'Partial Degradation';
                overall.className = 'overall overall-warn';
            } else {
                overall.textContent = 'All Systems Operational';
                overall.className = 'overall overall-ok';
            }

            const tbody = document.getElementById('tbody');
            tbody.innerHTML = '';
            data.services.forEach(s => {
                const ms = s.response_ms < 0 ? '--' : s.response_ms + 'ms';
                const pct = s.response_ms < 0 ? 0 : Math.min(100, Math.round(s.response_ms / s.threshold_ms * 100));
                const barColor = s.status === 'healthy' ? '#4ade80' : s.status === 'degraded' ? '#fbbf24' : '#f87171';
                tbody.innerHTML +=
                    '<tr>' +
                    '<td><span class="dot dot-' + s.status + '"></span>' + s.name + '</td>' +
                    '<td><span class="badge badge-' + s.status + '">' + s.status + '</span></td>' +
                    '<td class="ms">' + ms +
                    '<span class="bar-wrap"><span class="bar-fill" style="width:' + pct + '%;background:' + barColor + '"></span></span>' +
                    '</td>' +
                    '<td class="ms">' + s.threshold_ms + 'ms</td>' +
                    '</tr>';
            });

            const iRes = await fetch('/api/incidents');
            const iData = await iRes.json();
            const logBody = document.getElementById('log-body');
            if (iData.incidents.length === 0) {
                logBody.innerHTML = '<tr><td class="log-empty">No incidents recorded.</td></tr>';
            } else {
                logBody.innerHTML = '';
                iData.incidents.forEach(i => {
                    logBody.innerHTML +=
                        '<tr><td>' + i.timestamp.replace('T', ' ').substring(0,19) + '</td>' +
                        '<td>' + i.service + '</td>' +
                        '<td>' + i.note + '</td></tr>';
                });
            }

            document.getElementById('updated').textContent =
                'Live data — auto-refreshes every 10s | Last: ' + new Date().toLocaleTimeString();
        }

        load();
        setInterval(load, 10000);
    </script>
</body>
</html>
