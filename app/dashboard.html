<!DOCTYPE html>
<html>
<head>
    <title>DevOps Status Monitor</title>
    <style>
        :root {
            --bg: #0d1117;
            --surface: #161b22;
            --border: #30363d;
            --text: #e6edf3;
            --muted: #7d8590;
            --accent: #58a6ff;
            --green: #3fb950;
            --yellow: #d29922;
            --red: #f85149;
            --green-dim: #0d2b12;
            --yellow-dim: #2b1d00;
            --red-dim: #2b0c0c;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            font-size: 14px;
        }
        .nav {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 14px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .nav-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .nav-icon {
            width: 30px; height: 30px;
            background: var(--accent);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 800;
            color: #000;
            letter-spacing: -0.5px;
        }
        .nav-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--text);
        }
        .nav-right {
            display: flex;
            align-items: center;
            gap: 16px;
            font-size: 13px;
            color: var(--muted);
        }
        .overall-badge {
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .badge-ok { background: var(--green-dim); color: var(--green); border: 1px solid #1e4620; }
        .badge-warn { background: var(--yellow-dim); color: var(--yellow); border: 1px solid #4a3000; }
        .badge-bad { background: var(--red-dim); color: var(--red); border: 1px solid #4a1010; }

        .main { padding: 24px; }

        .meta {
            display: flex;
            gap: 24px;
            margin-bottom: 20px;
            padding: 12px 16px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 13px;
            color: var(--muted);
        }
        .meta-label {
            color: var(--accent);
            margin-right: 6px;
            font-weight: 500;
        }

        .section-title {
            font-size: 11px;
            font-weight: 600;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .section-title::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 1px;
            background: var(--border);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 24px;
        }
        .service-card {
            background: var(--surface);
            padding: 16px 20px;
            transition: background 0.15s;
        }
        .service-card:hover { background: #1c2128; }

        .service-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .service-name {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 15px;
            font-weight: 600;
            color: var(--text);
        }
        .dot {
            width: 9px; height: 9px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .dot-healthy { background: var(--green); box-shadow: 0 0 5px var(--green); animation: pulse 2s infinite; }
        .dot-degraded { background: var(--yellow); box-shadow: 0 0 5px var(--yellow); animation: pulse 2s infinite; }
        .dot-down { background: var(--red); }
        @keyframes pulse {
            0%,100% { opacity: 1; } 50% { opacity: 0.4; }
        }

        .status-pill {
            font-size: 11px;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .pill-healthy { background: var(--green-dim); color: var(--green); }
        .pill-degraded { background: var(--yellow-dim); color: var(--yellow); }
        .pill-down { background: var(--red-dim); color: var(--red); }

        .service-metrics { display: flex; gap: 20px; }
        .metric { flex: 1; }
        .metric-label {
            font-size: 11px;
            font-weight: 500;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }
        .metric-value {
            font-size: 18px;
            font-weight: 700;
            color: var(--text);
            line-height: 1.2;
        }
        .metric-sub {
            font-size: 12px;
            color: var(--muted);
            margin-top: 2px;
        }
        .bar-track {
            height: 4px;
            background: var(--border);
            border-radius: 2px;
            margin-top: 8px;
            overflow: hidden;
        }
        .bar-fill {
            height: 100%;
            border-radius: 2px;
            transition: width 0.5s ease;
        }

        .incident-log {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 24px;
        }
        .log-header {
            display: grid;
            grid-template-columns: 170px 150px 1fr;
            padding: 8px 16px;
            background: var(--bg);
            border-bottom: 1px solid var(--border);
            font-size: 11px;
            font-weight: 600;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .log-row {
            display: grid;
            grid-template-columns: 170px 150px 1fr;
            padding: 10px 16px;
            border-bottom: 1px solid var(--border);
            font-size: 13px;
            color: var(--muted);
        }
        .log-empty {
            padding: 16px;
            font-size: 13px;
            color: var(--muted);
        }

        .footer {
            text-align: center;
            padding: 16px;
            font-size: 12px;
            color: var(--muted);
            border-top: 1px solid var(--border);
        }
        .tech-badges {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 8px;
            flex-wrap: wrap;
        }
        .tech-badge {
            padding: 4px 10px;
            border: 1px solid var(--border);
            border-radius: 4px;
            font-size: 12px;
            color: var(--muted);
            font-weight: 500;
        }
    </style>
</head>
<body>

<nav class="nav">
    <div class="nav-left">
        <div class="nav-icon">ops</div>
        <span class="nav-title">DevOps Status Monitor</span>
    </div>
    <div class="nav-right">
        <span id="overall-badge" class="overall-badge badge-ok">Checking...</span>
        <span id="nav-time">--:--:--</span>
    </div>
</nav>

<div class="main">
    <div class="meta" id="meta-bar">
        <span><span class="meta-label">Version</span>--</span>
        <span><span class="meta-label">Env</span>--</span>
        <span><span class="meta-label">Host</span>--</span>
        <span><span class="meta-label">Uptime</span>--</span>
    </div>

    <div class="section-title">Live Service Health</div>
    <div class="services-grid" id="services-grid">
        <div class="service-card">
            <div style="color:var(--muted);font-size:13px">Initializing...</div>
        </div>
    </div>

    <div class="section-title">Incident Log</div>
    <div class="incident-log" id="log-container">
        <div class="log-empty">No incidents recorded.</div>
    </div>

    <div class="footer">
        <div id="last-updated">Connecting to services...</div>
        <div class="tech-badges">
            <span class="tech-badge">FastAPI</span>
            <span class="tech-badge">Docker</span>
            <span class="tech-badge">Azure</span>
            <span class="tech-badge">Terraform</span>
            <span class="tech-badge">GitHub Actions</span>
            <span class="tech-badge">Azure DevOps</span>
        </div>
    </div>
</div>

<script>
    function fmtMs(ms) { return ms < 0 ? '--' : ms + 'ms'; }
    function barColor(status) {
        if (status === 'healthy') return '#3fb950';
        if (status === 'degraded') return '#d29922';
        return '#f85149';
    }

    async function load() {
        try {
            const hRes = await fetch('/health');
            const health = await hRes.json();
            document.getElementById('meta-bar').innerHTML =
                '<span><span class="meta-label">Version</span>' + health.version + '</span>' +
                '<span><span class="meta-label">Env</span>' + health.environment + '</span>' +
                '<span><span class="meta-label">Host</span>' + health.hostname.substring(0,12) + '</span>' +
                '<span><span class="meta-label">Uptime</span>' + Math.floor(health.uptime_seconds/60) + 'm ' + (health.uptime_seconds%60) + 's</span>';

            const sRes = await fetch('/api/services');
            const data = await sRes.json();

            const hasDown = data.services.some(s => s.status === 'down');
            const hasDeg = data.services.some(s => s.status === 'degraded');
            const badge = document.getElementById('overall-badge');
            if (hasDown) { badge.textContent = 'Major Outage'; badge.className = 'overall-badge badge-bad'; }
            else if (hasDeg) { badge.textContent = 'Partial Degradation'; badge.className = 'overall-badge badge-warn'; }
            else { badge.textContent = 'All Systems Operational'; badge.className = 'overall-badge badge-ok'; }

            const grid = document.getElementById('services-grid');
            grid.innerHTML = '';
            data.services.forEach(s => {
                const pct = s.response_ms < 0 ? 0 : Math.min(100, Math.round(s.response_ms / s.threshold_ms * 100));
                grid.innerHTML +=
                    '<div class="service-card">' +
                    '<div class="service-header">' +
                    '<div class="service-name"><span class="dot dot-' + s.status + '"></span>' + s.name + '</div>' +
                    '<span class="status-pill pill-' + s.status + '">' + s.status + '</span>' +
                    '</div>' +
                    '<div class="service-metrics">' +
                    '<div class="metric">' +
                    '<div class="metric-label">Response Time</div>' +
                    '<div class="metric-value">' + fmtMs(s.response_ms) + '</div>' +
                    '<div class="bar-track"><div class="bar-fill" style="width:' + pct + '%;background:' + barColor(s.status) + '"></div></div>' +
                    '</div>' +
                    '<div class="metric">' +
                    '<div class="metric-label">Threshold</div>' +
                    '<div class="metric-value" style="color:var(--muted)">' + s.threshold_ms + 'ms</div>' +
                    '</div>' +
                    '</div>' +
                    '</div>';
            });

            const iRes = await fetch('/api/incidents');
            const iData = await iRes.json();
            const logContainer = document.getElementById('log-container');
            if (iData.incidents.length === 0) {
                logContainer.innerHTML = '<div class="log-empty">No incidents recorded.</div>';
            } else {
                let html = '<div class="log-header"><span>Timestamp</span><span>Service</span><span>Note</span></div>';
                iData.incidents.forEach(i => {
                    html += '<div class="log-row">' +
                        '<span>' + i.timestamp.substring(0,19).replace('T',' ') + '</span>' +
                        '<span style="color:var(--accent)">' + i.service + '</span>' +
                        '<span>' + i.note + '</span>' +
                        '</div>';
                });
                logContainer.innerHTML = html;
            }

            document.getElementById('nav-time').textContent = new Date().toLocaleTimeString();
            document.getElementById('last-updated').textContent =
                'Live data · auto-refreshes every 10s · last updated ' + new Date().toLocaleTimeString();

        } catch(e) { console.error(e); }
    }

    load();
    setInterval(load, 10000);
    setInterval(() => {
        document.getElementById('nav-time').textContent = new Date().toLocaleTimeString();
    }, 1000);
</script>
</body>
</html>
