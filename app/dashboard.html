<!DOCTYPE html>
<html>
<head>
    <title>DevOps Status Monitor</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #080c10;
            --surface: #0d1117;
            --border: #1e2d3d;
            --text: #c9d1d9;
            --muted: #484f58;
            --accent: #58a6ff;
            --green: #3fb950;
            --yellow: #d29922;
            --red: #f85149;
            --green-dim: #0d2b12;
            --yellow-dim: #2b1d00;
            --red-dim: #2b0c0c;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 0;
        }
        /* Top nav */
        .nav {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 0.75rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .nav-left {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        .nav-icon {
            width: 28px; height: 28px;
            background: var(--accent);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--bg);
        }
        .nav-title {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text);
            letter-spacing: 0.02em;
        }
        .nav-right {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            font-size: 0.75rem;
            color: var(--muted);
            font-family: 'JetBrains Mono', monospace;
        }
        .overall-badge {
            padding: 0.3rem 0.8rem;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 600;
            font-family: 'JetBrains Mono', monospace;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }
        .badge-ok { background: var(--green-dim); color: var(--green); border: 1px solid #1e4620; }
        .badge-warn { background: var(--yellow-dim); color: var(--yellow); border: 1px solid #4a3000; }
        .badge-bad { background: var(--red-dim); color: var(--red); border: 1px solid #4a1010; }

        /* Main content */
        .main { padding: 1.5rem 2rem; }

        /* Meta bar */
        .meta {
            display: flex;
            gap: 2rem;
            margin-bottom: 1.5rem;
            padding: 0.75rem 1rem;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 6px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            color: var(--muted);
        }
        .meta span { display: flex; align-items: center; gap: 0.4rem; }
        .meta-label { color: var(--accent); }

        /* Services grid */
        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 1px;
            background: var(--border);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 1.5rem;
        }
        .service-card {
            background: var(--surface);
            padding: 1.25rem 1.5rem;
            transition: background 0.15s;
        }
        .service-card:hover { background: #111820; }
        .service-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
        }
        .service-name {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text);
        }
        .dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .dot-healthy { background: var(--green); box-shadow: 0 0 6px var(--green); animation: pulse 2s infinite; }
        .dot-degraded { background: var(--yellow); box-shadow: 0 0 6px var(--yellow); animation: pulse-y 2s infinite; }
        .dot-down { background: var(--red); }
        @keyframes pulse {
            0%,100% { opacity: 1; } 50% { opacity: 0.4; }
        }
        @keyframes pulse-y {
            0%,100% { opacity: 1; } 50% { opacity: 0.4; }
        }
        .status-pill {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.65rem;
            font-weight: 600;
            padding: 0.2rem 0.5rem;
            border-radius: 3px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .pill-healthy { background: var(--green-dim); color: var(--green); }
        .pill-degraded { background: var(--yellow-dim); color: var(--yellow); }
        .pill-down { background: var(--red-dim); color: var(--red); }

        .service-metrics {
            display: flex;
            gap: 1.5rem;
        }
        .metric { flex: 1; }
        .metric-label {
            font-size: 0.65rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.3rem;
            font-family: 'JetBrains Mono', monospace;
        }
        .metric-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1rem;
            font-weight: 600;
            color: var(--text);
        }
        .bar-track {
            height: 3px;
            background: var(--border);
            border-radius: 2px;
            margin-top: 0.4rem;
            overflow: hidden;
        }
        .bar-fill {
            height: 100%;
            border-radius: 2px;
            transition: width 0.5s ease;
        }

        /* Section title */
        .section-title {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.65rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 0.75rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .section-title::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        /* Incident log */
        .incident-log {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 6px;
            overflow: hidden;
        }
        .log-row {
            display: grid;
            grid-template-columns: 160px 140px 1fr;
            padding: 0.6rem 1rem;
            border-bottom: 1px solid var(--border);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.72rem;
            color: var(--muted);
        }
        .log-empty {
            padding: 1rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.72rem;
            color: var(--muted);
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 1rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.65rem;
            color: var(--muted);
            border-top: 1px solid var(--border);
            margin-top: 1.5rem;
        }
        .tech-badges {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 0.5rem;
            flex-wrap: wrap;
        }
        .tech-badge {
            padding: 0.2rem 0.6rem;
            border: 1px solid var(--border);
            border-radius: 3px;
            font-size: 0.6rem;
            color: var(--muted);
        }
    </style>
</head>
<body>

<nav class="nav">
    <div class="nav-left">
        <div class="nav-icon">ops</div>
        <span class="nav-title">DevOps Status Monitor</span>
    </div>
    <div class="nav-right">
        <span id="overall-badge" class="overall-badge badge-ok">checking...</span>
        <span id="nav-time">--:--:--</span>
    </div>
</nav>

<div class="main">
    <div class="meta" id="meta-bar">
        <span><span class="meta-label">version</span> --</span>
        <span><span class="meta-label">env</span> --</span>
        <span><span class="meta-label">host</span> --</span>
        <span><span class="meta-label">uptime</span> --</span>
    </div>

    <div class="section-title">Live Service Health</div>
    <div class="services-grid" id="services-grid">
        <div class="service-card">
            <div style="color:var(--muted);font-size:0.8rem;font-family:'JetBrains Mono',monospace">Initializing...</div>
        </div>
    </div>

    <div class="section-title">Incident Log</div>
    <div class="incident-log">
        <div class="log-empty" id="log-body">No incidents recorded.</div>
    </div>

    <div class="footer">
        <div id="last-updated">Connecting to services...</div>
        <div class="tech-badges">
            <span class="tech-badge">FastAPI</span>
            <span class="tech-badge">Docker</span>
            <span class="tech-badge">Azure</span>
            <span class="tech-badge">Terraform</span>
            <span class="tech-badge">GitHub Actions</span>
            <span class="tech-badge">Azure DevOps</span>
        </div>
    </div>
</div>

<script>
    function fmtMs(ms) {
        if (ms < 0) return '--';
        return ms + 'ms';
    }

    function barColor(status) {
        if (status === 'healthy') return '#3fb950';
        if (status === 'degraded') return '#d29922';
        return '#f85149';
    }

    async function load() {
        try {
            const hRes = await fetch('/health');
            const health = await hRes.json();

            document.getElementById('meta-bar').innerHTML =
                '<span><span class="meta-label">version</span> ' + health.version + '</span>' +
                '<span><span class="meta-label">env</span> ' + health.environment + '</span>' +
                '<span><span class="meta-label">host</span> ' + health.hostname.substring(0,12) + '</span>' +
                '<span><span class="meta-label">uptime</span> ' + Math.floor(health.uptime_seconds/60) + 'm ' + (health.uptime_seconds%60) + 's</span>';

            const sRes = await fetch('/api/services');
            const data = await sRes.json();

            const hasDown = data.services.some(s => s.status === 'down');
            const hasDeg = data.services.some(s => s.status === 'degraded');
            const badge = document.getElementById('overall-badge');
            if (hasDown) {
                badge.textContent = 'Major Outage';
                badge.className = 'overall-badge badge-bad';
            } else if (hasDeg) {
                badge.textContent = 'Partial Degradation';
                badge.className = 'overall-badge badge-warn';
            } else {
                badge.textContent = 'All Systems Operational';
                badge.className = 'overall-badge badge-ok';
            }

            const grid = document.getElementById('services-grid');
            grid.innerHTML = '';
            data.services.forEach(s => {
                const pct = s.response_ms < 0 ? 0 : Math.min(100, Math.round(s.response_ms / s.threshold_ms * 100));
                grid.innerHTML +=
                    '<div class="service-card">' +
                    '<div class="service-header">' +
                    '<div class="service-name"><span class="dot dot-' + s.status + '"></span>' + s.name + '</div>' +
                    '<span class="status-pill pill-' + s.status + '">' + s.status + '</span>' +
                    '</div>' +
                    '<div class="service-metrics">' +
                    '<div class="metric">' +
                    '<div class="metric-label">Response</div>' +
                    '<div class="metric-value">' + fmtMs(s.response_ms) + '</div>' +
                    '<div class="bar-track"><div class="bar-fill" style="width:' + pct + '%;background:' + barColor(s.status) + '"></div></div>' +
                    '</div>' +
                    '<div class="metric">' +
                    '<div class="metric-label">Threshold</div>' +
                    '<div class="metric-value" style="color:var(--muted)">' + s.threshold_ms + 'ms</div>' +
                    '</div>' +
                    '</div>' +
                    '</div>';
            });

            const iRes = await fetch('/api/incidents');
            const iData = await iRes.json();
            const logBody = document.getElementById('log-body');
            if (iData.incidents.length === 0) {
                logBody.outerHTML = '<div class="log-empty" id="log-body">No incidents recorded.</div>';
            } else {
                let html = '';
                iData.incidents.forEach(i => {
                    html += '<div class="log-row">' +
                        '<span>' + i.timestamp.substring(0,19).replace('T',' ') + '</span>' +
                        '<span style="color:var(--accent)">' + i.service + '</span>' +
                        '<span>' + i.note + '</span>' +
                        '</div>';
                });
                logBody.outerHTML = '<div id="log-body">' + html + '</div>';
            }

            document.getElementById('nav-time').textContent = new Date().toLocaleTimeString();
            document.getElementById('last-updated').textContent =
                'Live data · auto-refreshes every 10s · last updated ' + new Date().toLocaleTimeString();

        } catch(e) {
            console.error(e);
        }
    }

    load();
    setInterval(load, 10000);
    setInterval(() => {
        document.getElementById('nav-time').textContent = new Date().toLocaleTimeString();
    }, 1000);
</script>
</body>
</html>
