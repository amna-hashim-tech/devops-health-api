<text font-family="'Segoe UI',sans-serif" font-size="11" fill="#7d8590" x="279" y="120" text-anchor="middle">triggers</text>
<path d="M240 172 L280 172 L280 235 L318 235" fill="none" stroke="#484f58" stroke-width="1" marker-end="url(#arrow)"/>
<text font-family="'Segoe UI',sans-serif" font-size="11" fill="#7d8590" x="279" y="210" text-anchor="middle">triggers</text>
